<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c26" />
      <stop offset="100%" stop-color="#0b0d11" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with gold border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#FACC15" stroke-width="6" stroke-opacity="0.3" />

  <!-- Center Flame / Forge Symbol -->
  <g filter="url(#glow)">
    <!-- Outer flame -->
    <path d="M256 80 C270 140 340 180 340 280 C340 370 270 420 256 420 C242 420 172 370 172 280 C172 200 240 140 256 80 Z" fill="url(#goldGrad)" />
    <!-- Inner bright flame -->
    <path d="M256 190 C265 230 300 260 300 320 C300 370 265 395 256 395 C247 395 212 370 212 320 C212 270 245 230 256 190 Z" fill="#FEF08A" />
  </g>

  <!-- Stylized FF text -->
  <text x="256" y="340" font-family="Arial, sans-serif" font-weight="900" font-size="72" text-anchor="middle" fill="#0B0D11" letter-spacing="-2">FF</text>
</svg>
